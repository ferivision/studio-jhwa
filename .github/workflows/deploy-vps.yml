name: Deploy to VPS
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy (rollback). Leave empty to build this commit."
        required: false
        default: ""
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-vps
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  build:
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            SITE_ENV=production
  deploy:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate image tag (it is interpolated into a remote command)
        run: |
          case "$TAG" in
            *[!A-Za-z0-9_.-]*|"") echo "Invalid image tag" >&2; exit 1 ;;
          esac
      - name: Configure SSH (host key pinned via VPS_KNOWN_HOSTS)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload compose files
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: scp docker-compose.yml Caddyfile "${VPS_USER}@${VPS_HOST}:/opt/studio-jhwa/"
      - name: Pull and restart
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            "cd /opt/studio-jhwa && IMAGE_TAG='${TAG}' docker compose pull app && IMAGE_TAG='${TAG}' docker compose up -d --no-build && docker image prune -f"
      - name: Smoke check
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: ssh "${VPS_USER}@${VPS_HOST}" "curl -fsS https://\$(grep ^SITE_DOMAIN= /opt/studio-jhwa/.env | cut -d= -f2)/api/health"
